name: Release

# A tag such as v0.5.0 releases the command: binaries for macOS, Linux and
# Windows, their checksums, and a GitHub build attestation for each file;
# then the Homebrew formula in secretli/homebrew-tap moves to it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="$GITHUB_REF_NAME"
          name="secretli_${version}_${GOOS}_${GOARCH}"
          mkdir -p "build/${name}" dist
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          go build -trimpath \
            -ldflags="-s -w -X github.com/secretli/cli/internal/cli.Version=${version}" \
            -o "build/${name}/secretli${ext}" ./cmd/secretli
          cp LICENSE README.md "build/${name}/"
          if [ "$GOOS" = "windows" ]; then
            (cd "build/${name}" && zip -q "../../dist/${name}.zip" ./*)
          else
            tar -C "build/${name}" -czf "dist/${name}.tar.gz" "secretli${ext}" LICENSE README.md
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  # The whole of Secretli with this release's client: the server, the web
  # app and the browser, behind a gateway like production's (secretli/e2e).
  # Nothing is released unless it passes.
  whole-setup:
    uses: secretli/e2e/.github/workflows/whole-setup.yml@main
    secrets: inherit
    with:
      cli_ref: ${{ github.sha }}

  release:
    needs: [build, whole-setup]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release
      id-token: write # sign the attestations
      attestations: write # store the attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > checksums.txt

      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$GITHUB_REF_NAME"
          cat > notes.md <<EOF
          The \`secretli\` command, ${version}. It shares and opens secrets with the same encryption and the same links as the web app.

          Download the archive for your system, unpack it, and put \`secretli\` on your PATH. Every file carries a build attestation from this repository's release workflow; to check a download:

          \`\`\`bash
          gh attestation verify secretli_${version}_darwin_arm64.tar.gz --repo ${GITHUB_REPOSITORY}
          \`\`\`

          With a Go toolchain: \`go install github.com/secretli/cli/cmd/secretli@${version}\`
          EOF
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "secretli ${version}" --notes-file notes.md --generate-notes dist/*

  # Puts the release into secretli/homebrew-tap, which `brew install
  # secretli/tap/secretli` and `brew upgrade` read. The tap's deploy key is
  # the only thing allowed to push there. Pre-releases (tags with a dash) stay
  # out of it.
  homebrew:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: secretli/homebrew-tap
          path: tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      - name: Formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern checksums.txt --dir "$RUNNER_TEMP"
          mkdir -p tap/Formula
          scripts/homebrew-formula.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/checksums.txt" > tap/Formula/secretli.rb

      - name: Push to the tap
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/secretli.rb
          if git diff --cached --quiet; then
            echo "The formula is already at ${GITHUB_REF_NAME}."
            exit 0
          fi
          git commit -m "secretli ${GITHUB_REF_NAME}"
          git push
