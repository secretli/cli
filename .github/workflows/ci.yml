name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          args: ./...

      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - run: go test -race -cover ./...

  # The same tests against a real server, the latest published image, so
  # the fake in internal/share/sharetest cannot drift from what it imitates.
  # Checks that look inside the fake are skipped there.
  real-server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The server's stack pulls SeaweedFS, which is only on Docker Hub, and
      # Docker Hub limits anonymous pulls from shared runners: pull it as the
      # organisation's read-only user. A failed login leaves an anonymous
      # pull, which usually still works.
      - name: Log in to Docker Hub
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The server repository knows what the server needs to run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: secretli/server
          path: server
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Registries limit anonymous pulls per address, and runners share
      # theirs: a burst of jobs is turned down ("Rate exceeded" from ECR
      # Public, "toomanyrequests" from Docker Hub) and passes a little later.
      # Starting pulls the images, so starting is tried again.
      - name: Start a Secretli server
        run: |
          retry() {
            for attempt in 1 2 3 4 5; do
              "$@" && return 0
              [ "$attempt" = 5 ] && break
              echo "attempt $attempt failed, trying again in $((attempt * 10))s" >&2
              sleep $((attempt * 10))
            done
            return 1
          }
          retry docker compose -f server/docker/docker-compose.yml up -d postgres seaweedfs createbucket
          docker compose -f server/docker/docker-compose.yml wait createbucket
          # Raised rate limits: the tests send many requests from one address.
          docker run -d --name secretli-server --network host \
            -e DATABASE_URL='postgres://secretli:secretli@localhost:5432/secretli?sslmode=disable' \
            -e S3_ENDPOINT=http://localhost:8333 -e S3_BUCKET=secretli -e S3_ACCESS_KEY=admin -e S3_SECRET_KEY=admin \
            -e SERVER_PORT=8080 -e RATE_LIMIT_MULTIPLIER=100 \
            ghcr.io/secretli/server:main
          for i in {1..60}; do
            if curl -fsS -o /dev/null http://localhost:8080/api/v1/health/ready; then
              echo "server $(curl -sS http://localhost:8080/api/v1/version)"
              exit 0
            fi
            sleep 1
          done
          docker logs secretli-server
          exit 1

      - name: Tests against the real server
        env:
          SECRETLI_TEST_SERVER: http://localhost:8080
        run: go test -race -count=1 ./...

      - name: Server logs
        if: failure()
        run: docker logs secretli-server

  # The whole of Secretli with this change's client: the server, the web app
  # and the browser, behind a gateway like production's (secretli/e2e), so a
  # problem shows up here rather than when a release is tagged.
  whole-setup:
    uses: secretli/e2e/.github/workflows/whole-setup.yml@main
    secrets: inherit
    with:
      cli_ref: ${{ github.event.pull_request.head.sha || github.sha }}

  # Every system a release ships for has to build on every change, so a
  # break on one of them shows up here and not on release day.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o /dev/null ./cmd/secretli
